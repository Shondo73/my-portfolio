        function vert(arr,  j = 1) {
            //console.log('!');

                } 
            }
            return hor;

    //квадрат

        function squar(arr, i,  j) {
            let a;
            let b;
            if (i < 3) {
                a=0;
            } else if ( i<6 ) {
                a=3
            } else {
                a=6
            }
            if (j < 3) {
                b=0;
            } else if ( j<6 ) {
                b=3
            } else {
                b=6
            }
            let squa = [];
            for (let i = a; i < 3+a; i++) {
                for (let j = b; j < 3+b; j++){
                    if (!(arr[i][j]=== 0)) {
                    squa.push(arr[i][j]);
                }
                        
                }
            } 
            return squa; 
        }

                } else {

                } 
                     
            }
